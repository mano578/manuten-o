<script>
  // ================= MÓDULO OPERACIONAL: TONELADAS DA FROTA =================
  function carregarListaToneladas() {
    var tbody = document.getElementById('tbody-historico-toneladas'); if(!tbody) return;
    tbody.innerHTML = '<tr><td colspan="7" class="vazio-msg">Sincronizando histórico de toneladas...</td></tr>';
    google.script.run.withSuccessHandler(function(lista) {
      toneladasGlobal = lista;
      if(!lista || lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="vazio-msg">Nenhum registro de pesagem encontrado.</td></tr>'; return;
      }
      var html = '';
      for(var i=0; i<Math.min(lista.length, 100); i++) { 
        html += `<tr>
          <td>${lista[i].data}</td>
          <td>${lista[i].placa}</td>
          <td style="color:#0284c7; font-weight:bold;">${lista[i].veiculo}</td>
          <td>${lista[i].ticket}</td>
          <td style="color:#166534; font-weight:600;">${lista[i].liquido}</td>
          <td>${lista[i].tipoMaterial}</td>
          <td>${lista[i].motorista}</td>
        </tr>`;
      }
      tbody.innerHTML = html;
    }).listarToneladas();
  }

  async function processarArquivosToneladas(event) {
    var files = event.target.files; if (!files.length) return;
    var statusDiv = document.getElementById('status-leitor-toneladas'); 
    statusDiv.style.display = 'block'; 
    toneladasLoteGlobal = []; 
    
    for (let i = 0; i < files.length; i++) {
      let file = files[i]; 
      statusDiv.innerText = `⏳ Lendo arquivo de pesagem (${i + 1}/${files.length}): ${file.name}`;
      try {
        if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls') || file.name.endsWith('.csv')) {
          let dadosPlanilha = await lerPlanilhaExcelToneladas(file); 
          toneladasLoteGlobal.push(...dadosPlanilha);
        } else { statusDiv.innerText = "⚠️ Formato não suportado."; }
      } catch (e) { console.error("Falha ao ler: " + file.name, e); }
    }
    statusDiv.innerText = `✅ Processamento concluído! Verifique a tabela abaixo.`; 
    renderizarPreviewToneladas();
  }

  function lerPlanilhaExcelToneladas(file) {
    return new Promise((resolve) => {
      let reader = new FileReader();
      reader.onload = function(e) {
        let data = new Uint8Array(e.target.result); 
        let workbook = XLSX.read(data, {type: 'array', raw: true});
        let primeiraAba = workbook.SheetNames[0]; 
        let linhasJson = XLSX.utils.sheet_to_json(workbook.Sheets[primeiraAba], {header: 1, raw: true, defval: ""});
        
        let resultados = [];
        if (linhasJson.length > 1) {
          for(let r = 1; r < linhasJson.length; r++) {
            let row = linhasJson[r]; 
            if(!row || row.length === 0) continue; 
            if(row[1] === "" && row[4] === "") continue; 
            
            let placaLida = row[4] ? String(row[4]).trim().toUpperCase() : "";
            let veiculoLido = row[5] ? String(row[5]).trim().toUpperCase() : "";
            
            let veiculoMatch = frotaGlobal.find(v => v.placa.replace(/[^A-Z0-9]/g, '') === placaLida.replace(/[^A-Z0-9]/g, ''));
            if (veiculoMatch) { veiculoLido = veiculoMatch.prefixo; }
            
            let ticketLido = row[7] ? String(row[7]).trim() : "";
            let isDuplicado = toneladasGlobal.some(t => t.ticket === ticketLido && ticketLido !== "");

            resultados.push({
              id: row[0] ? String(row[0]) : "",
              data: formatarDataExcel(row[1]),
              dia: row[2] ? String(row[2]).trim().toUpperCase() : "",
              motorista: row[3] ? String(row[3]).trim().toUpperCase() : "",
              placa: placaLida,
              veiculo: veiculoLido,
              setor: row[6] ? String(row[6]).trim().toUpperCase() : "",
              ticket: ticketLido,
              liquido: capturarNumeroLimpo(row[8]),
              turno: row[9] ? String(row[9]).trim().toUpperCase() : "",
              tipoMaterial: row[10] ? String(row[10]).trim().toUpperCase() : "",
              observacao: row[11] ? String(row[11]).trim().toUpperCase() : "",
              duplicado: isDuplicado
            });
          }
        }
        resolve(resultados);
      };
      reader.readAsArrayBuffer(file);
    });
  }

  function renderizarPreviewToneladas() {
    var tbody = document.getElementById('tbody-preview-toneladas'); 
    var container = document.getElementById('container-preview-toneladas'); if(!container) return;
    if(!toneladasLoteGlobal.length) { container.style.display = 'none'; return; } 
    
    container.style.display = 'block'; 
    var html = '';
    
    toneladasLoteGlobal.forEach((item) => {
      let trStyle = item.duplicado ? 'background-color: #fee2e2; color: #991b1b;' : '';
      let tdAviso = item.duplicado ? '<span style="background:#b91c1c; color:#fff; padding:2px 4px; border-radius:4px;">JÁ SALVO</span> ' : '';

      html += `<tr style="${trStyle}">
        <td>${item.id}</td>
        <td>${item.data}</td>
        <td>${item.dia}</td>
        <td>${item.motorista}</td>
        <td><strong>${item.placa}</strong></td>
        <td style="color:#0284c7; font-weight:bold;">${item.veiculo}</td>
        <td>${item.setor}</td>
        <td><strong>${item.ticket}</strong></td>
        <td>${item.liquido}</td>
        <td>${item.turno}</td>
        <td>${item.tipoMaterial}</td>
        <td>${tdAviso}${item.observacao}</td>
      </tr>`;
    });
    
    tbody.innerHTML = html;
  }

  function gravarLoteToneladasVerificado() {
    let validos = toneladasLoteGlobal.filter(i => !i.duplicado);
    let duplicados = toneladasLoteGlobal.length - validos.length;
    
    let msgConfirmacao = `Deseja inserir os ${validos.length} registros válidos no banco de dados?`;
    if(duplicados > 0) {
       msgConfirmacao = `Atenção: O sistema identificou ${duplicados} Tickets duplicados (linhas vermelhas). Eles SERÃO IGNORADOS para não poluir o banco.\n\nDeseja salvar os ${validos.length} registros NOVOS?`;
    }
    if(validos.length === 0) return alert("Todos os registros carregados já constam no banco de dados. Nada a salvar.");
    
    if(!confirm(msgConfirmacao)) return;
    
    var btn = document.getElementById('btn-gravar-lote-ton'); 
    btn.disabled = true; btn.innerText = "A inserir dados...";
    
    google.script.run.withSuccessHandler(function(res) {
      alert(res.mensagem);
      if(res.sucesso) { 
        toneladasLoteGlobal = []; 
        document.getElementById('input-toneladas-massa').value = ''; 
        document.getElementById('status-leitor-toneladas').innerText = 'Aguardando seleção de arquivos...'; 
        renderizarPreviewToneladas(); 
        carregarListaToneladas(); 
      }
      btn.disabled = false; btn.innerText = "💾 Inserir Dados Válidos";
    }).salvarToneladasLote(validos);
  }
</script>
