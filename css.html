<style>
  * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
  body { background-color: #f8fafc; color: #0f172a; overflow: hidden; height: 100vh; display: flex; }

  .btn-amarelo { background: #f59e0b; } .btn-amarelo:hover { background: #d97706; }
  .btn-azul-claro { background: #0ea5e9; } .btn-azul-claro:hover { background: #0284c7; }

  .tag-cat.ativo { background: #dcfce7; color: #166534; }

  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 4000; justify-content: center; align-items: center; padding: 15px;}
  .modal-box { background: white; width: 100%; max-width: 800px; max-height: 95vh; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; animation: slideUp 0.3s ease; }

  .modal-header { padding: 15px 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; background: #f8fafc; }

  .btn-fechar { background: none; border: none; font-size: 24px; color: #64748b; cursor: pointer; transition: color 0.2s; padding: 0 10px;}

  .info-item { background: #f1f5f9; padding: 10px; border-radius: 8px; border-left: 4px solid #10b981; }

  .lista-check-funcionarios { border: 1px solid #cbd5e1; border-radius: 8px; max-height: 250px; overflow-y: auto; background: #f8fafc; padding: 10px;}

  /* ================= NOVO MODELO DE IMPRESSÃO DE ESCALA (REVISADO) ================= */
  /* ================= SUBSTITUIÇÃO COMPLETA: ESTILOS DE IMPRESSÃO E VISUALIZAÇÃO DE ESCALAS ================= */
  
  /* ESTILOS PARA MODAL DE EDIÇÃO ON-SCREEN */
  .table-edicao-folgas thead th { background-color: #f1f5f9; color: #475569; font-weight: 700; text-transform: uppercase; border-bottom: 2px solid #e2e8f0; }
  .input-edicao-folga { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; text-transform: uppercase; font-family: 'Poppins', sans-serif;}
  .input-edicao-folga:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); outline: none; }

  /* TEMPLATE DE IMPRESSÃO PROFISSIONAL INOVAR (MODO PAISAGEM) */
  /* ================= TEMPLATE DE IMPRESSÃO PROFISSIONAL (CORRIGIDO) ================= */
  /* ================= TEMPLATE DE IMPRESSÃO PROFISSIONAL (REVISÃO FINAL) ================= */
  /* ================= VISUAL DOS BALÕES (CARDS) DE ESCALAS GERADAS ================= */
  .grid-escalas { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  .card-escala { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; gap: 10px; border-left: 6px solid #10b981; }
  .card-escala:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); border-left-color: #059669; }
  .card-escala h4 { margin: 0; font-size: 14px; color: #1e293b; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;}
  .card-escala p { margin: 0; font-size: 13px; color: #64748b; font-weight: 500; }

  /* ================= TEMPLATE DE IMPRESSÃO PROFISSIONAL (REVISÃO FINAL) ================= */
 /* ================= ESTILOS DAS PERMISSÕES (À PROVA DE FALHAS) ================= */
  .grid-permissoes {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      gap: 10px !important;
      background: #f8fafc !important;
      padding: 12px !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 8px !important;
      max-height: 220px !important;
      overflow-y: auto !important;
  }
  
  /* Vence a regra global que quebra as linhas das labels */
  .input-group .grid-permissoes label {
      display: flex !important;
      flex-direction: row !important;
      align-items: center !important;
      justify-content: flex-start !important;
      gap: 10px !important;
      padding: 8px 12px !important;
      background: #ffffff !important;
      border: 1px solid #e2e8f0 !important;
      border-radius: 6px !important;
      cursor: pointer !important;
      margin: 0 !important;
      font-size: 12px !important;
      font-weight: 600 !important;
      color: #334155 !important;
      transition: all 0.2s !important;
  }

  .input-group .grid-permissoes label:hover {
      background: #f1f5f9 !important;
      border-color: #94a3b8 !important;
  }

  /* Vence a regra global "width: 100%" que estava a esticar as caixinhas */
  .input-group .grid-permissoes label input[type="checkbox"] {
      width: 18px !important;
      height: 18px !important;
      min-width: 18px !important;
      margin: 0 !important;
      padding: 0 !important;
      cursor: pointer !important;
      accent-color: #3b82f6 !important;
      box-shadow: none !important;
  }

  @media (max-width: 480px) {
      .grid-permissoes { grid-template-columns: 1fr !important; }
  }
  /* ================= MODO DE IMPRESSÃO PROFISSIONAL BLINDADO ================= */
  /* ================= MODO DE IMPRESSÃO PROFISSIONAL (COM MARGEM SEGURA) ================= */
  @media print {
    /* 1. Devolvemos a margem de 10mm para proteger o topo da Página 2, 3, etc. */
    @page { size: landscape; margin: 10mm; } 
    
    html, body { 
        height: auto !important; 
        overflow: visible !important; 
        background: white !important; 
    }
    
    body * { visibility: hidden; }
    
    .aba-tela, .modal-overlay, .sidebar, #tela-login, .mobile-header, #painel-detalhes-dia { 
        display: none !important; 
    }
    
    body > div:not(#sistema-principal):not(#area-impressao-escala-profissional),
    .main-content > div:not(#area-impressao-escala-profissional) {
        display: none !important;
    }

    #area-impressao-escala-profissional, 
    #area-impressao-escala-profissional * { 
        visibility: visible !important; 
    }
    
    #area-impressao-escala-profissional { 
      display: block !important; 
      position: relative !important; 
      left: 0; 
      top: 0; 
      width: 100% !important; 
      border: none; 
      /* Limpamos o padding extra porque a @page já dá a margem necessária */
      padding: 0 !important; 
      margin: 0; 
      box-sizing: border-box !important;
    }

    .print-table { page-break-inside: auto; width: 100%; }
